    <script>
      (function() {
        // Prevent extension collisions where multiple Web3 wallets attempt to overwrite window.ethereum
        try {
          var _eth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _eth;
            },
            set: function(val) {
              _eth = val;
            }
          });
        } catch (e) {}

        // Catch and prevent unhandled "Cannot set property ethereum of #<Window> which has only a getter"
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            typeof event.message === 'string' &&
            event.message.indexOf('Cannot set property ethereum') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            (event.reason.message || String(event.reason)).indexOf('Cannot set property ethereum') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
