[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
optimizer = true
optimizer_runs = 1000000
via_ir = false
evm_version = "paris"
auto_detect_solc = true

# RPC aliases read from the environment, e.g.
#   export ARBITRUM_RPC_URL=https://arb1.arbitrum.io/rpc
#   export BASE_RPC_URL=https://mainnet.base.org
#   export OPTIMISM_RPC_URL=https://mainnet.optimism.io
# Public endpoints are rate limited; use a paid RPC for repeated fork runs.
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"

[fuzz]
runs = 512
