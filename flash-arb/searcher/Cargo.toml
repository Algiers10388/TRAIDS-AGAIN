[package]
name = "flash-arb-searcher"
version = "0.1.0"
edition = "2021"
description = "Multi-chain DeFi flash loan arbitrage searcher (Aave V3 + Uniswap V2/V3 + Solidly forks)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
ethers = { version = "2.0", features = ["ws", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }

# NOTE: no `panic = "abort"`. Each chain worker runs in its own tokio task, so a panic
# in one chain must not take the others down.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
