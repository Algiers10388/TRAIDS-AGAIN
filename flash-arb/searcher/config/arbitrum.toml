# Arbitrum One (chain id 42161)
# RPC endpoints: override with env RPC_HTTP_ARBITRUM / RPC_WS_ARBITRUM (use a provider key for production).
chain_id = 42161
chain_name = "arbitrum"
rpc_http = "https://arb1.arbitrum.io/rpc"
rpc_ws = ""
relay_endpoint = ""          # empty = broadcast through rpc_http
is_l2 = true
priority_fee_bidding = false # Arbitrum's sequencer is first-come-first-served; tips do not buy priority
tip_share_percent = 0
poll_interval_ms = 500

aave_v3_pool = "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
aave_v3_addresses_provider = "0xa97684ead0e402dC232d5A977953DF7ECBAB3CDb"
aave_flash_fee_bps = 5

# Set after deploying FlashArb (constructor takes the Aave addresses provider). Zero = scan only.
flash_arb_contract = "0x0000000000000000000000000000000000000000"

[dexes.uniswap_v3]
kind = "v3"                  # SwapRouter (v1, with deadline)
router = "0xE592427A0AEce92De3Edee1F18E0157C05861564"
quoter = "0xb27308f9F90D607463bb33eA1BeBb41C27CE5AB6"
quoter_v2 = false
factory = "0x1F98431c8aD98523631AE4a59f267346ea31F984"

[dexes.sushiswap_v2]
kind = "v2"
router = "0x1b02dA8Cb0d097eB8D57A175b88c7D8b47997506"
factory = "0xc35DADB65012eC5796536bD9864eD8773aBc74C4"

# Pairs to scan. Base must be WETH or a stablecoin so profit can be priced in USD.
[[pairs]]
base = "WETH"
quote = "USDC"

[[pairs]]
base = "WETH"
quote = "USDT"

[[pairs]]
base = "WETH"
quote = "ARB"

[tokens]
WETH = "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
USDC = "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
USDT = "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
ARB  = "0x912CE59144191C1204E64559FE8253a0e49E6548"

[risk]
min_net_profit_usd = 8.00
max_gas_per_tx = 850000
daily_revert_loss_cap_usd = 75.00
consecutive_failure_limit = 3
dry_run = true               # must be false AND the binary started with --live to send transactions
max_loan_usd = 25000.0
extra_cost_usd = 0.10        # L1 data fee allowance
excluded_tokens = [
    "0x5979D7b546E38E414F7E9822514be443A4800529", # wstETH
]

[beneficiary]
profit_recipient_address = "0xc102BB3848DD0397dEB6C655721F756Aa9F9f15d"
label = "Main Arb Profit Vault"
auto_sweep = true

[signer]
gas_wallet_address = "0xF1d765d693f9e6fAb0c4a2FCa942d9D54233C966"
label = "Arbitrum One Gas Funder"
private_key_env = "FLASH_ARB_SIGNER_KEY"
